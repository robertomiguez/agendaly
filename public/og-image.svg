<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agendaly logo preview</title>
  <desc id="desc">Agendaly wordmark with a calendar mark for social sharing previews.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf4f0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="992" cy="105" r="150" fill="#dbeafe" opacity="0.55"/>
  <circle cx="190" cy="545" r="170" fill="#d1fae5" opacity="0.58"/>
  <g filter="url(#shadow)">
    <rect x="183" y="178" width="834" height="274" rx="42" fill="#ffffff"/>
  </g>
  <g transform="translate(255 245)">
    <rect x="0" y="20" width="118" height="118" rx="28" fill="url(#mark)"/>
    <rect x="22" y="48" width="74" height="66" rx="12" fill="#ffffff"/>
    <rect x="22" y="48" width="74" height="18" rx="8" fill="#dbeafe"/>
    <circle cx="42" cy="84" r="7" fill="#2563eb"/>
    <circle cx="59" cy="84" r="7" fill="#10b981"/>
    <circle cx="76" cy="84" r="7" fill="#2563eb"/>
    <path d="M42 26v26M76 26v26" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="405" y="334" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="0">Agendaly</text>
  <text x="410" y="386" fill="#4b5563" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="0">Online scheduling made simple</text>
